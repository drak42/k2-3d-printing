<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="270" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Pressure advance at a corner (top view)</text>
  <g font-size="14" text-anchor="middle" fill="none" stroke-linecap="round">
    <path d="M60,190 L160,80 L260,190" stroke="#e07b39" stroke-width="10"/>
    <circle cx="160" cy="84" r="13" fill="#e07b39" stroke="none"/>
    <path d="M240,170 L260,190" stroke="#e07b39" stroke-width="16"/>
    <path d="M330,190 L430,80 L530,190" stroke="#e07b39" stroke-width="10"/>
    <path d="M590,190 L670,92" stroke="#e07b39" stroke-width="10"/>
    <path d="M684,110 L710,142" stroke="#e07b39" stroke-width="4"/>
    <path d="M718,152 L748,190" stroke="#e07b39" stroke-width="10"/>
  </g>
  <g font-size="14" text-anchor="middle">
    <text x="160" y="220" font-weight="bold" fill="#c0392b">PA too low</text><text x="160" y="238">bulging corner, fat line ends</text>
    <text x="430" y="220" font-weight="bold" fill="#1a7a4a">PA right</text><text x="430" y="238">sharp corner, even width</text>
    <text x="670" y="220" font-weight="bold" fill="#c0392b">PA too high</text><text x="670" y="238">gap or thin line after corner</text>
  </g>
  <text x="380" y="262" text-anchor="middle" font-size="14" fill="#444">The pattern test prints corners at many PA values: choose the sharpest, most even one.</text>
</svg>
