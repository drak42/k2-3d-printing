<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="260" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Normal seam vs scarf seam (side view of one wall)</text>
  <g font-size="14" text-anchor="middle">
    <!-- normal -->
    <g fill="#e07b39" stroke="#fff" stroke-width="1.5">
      <rect x="40" y="70" width="300" height="24"/><rect x="40" y="94" width="300" height="24"/><rect x="40" y="118" width="300" height="24"/><rect x="40" y="142" width="300" height="24"/>
    </g>
    <g fill="#b85a22"><circle cx="190" cy="82" r="7"/><circle cx="190" cy="106" r="7"/><circle cx="190" cy="130" r="7"/><circle cx="190" cy="154" r="7"/></g>
    <text x="190" y="196" font-weight="bold">Normal seam</text><text x="190" y="214">each loop starts and stops in one spot,</text><text x="190" y="232">leaving a visible line of blobs</text>
    <!-- scarf -->
    <g fill="#e07b39" stroke="#fff" stroke-width="1.5">
      <polygon points="420,70 720,70 720,94 420,94"/>
      <polygon points="420,94 720,94 720,118 420,118"/>
      <polygon points="420,118 720,118 720,142 420,142"/>
      <polygon points="420,142 720,142 720,166 420,166"/>
    </g>
    <g fill="#f2a46d" stroke="#b85a22" stroke-width="1">
      <polygon points="520,94 620,70 620,94"/><polygon points="520,118 620,94 620,118"/><polygon points="520,142 620,118 620,142"/><polygon points="520,166 620,142 620,166"/>
    </g>
    <text x="570" y="196" font-weight="bold">Scarf seam</text><text x="570" y="214">loop ends ramp up and down over each other,</text><text x="570" y="232">so the join blends into the wall</text>
  </g>
</svg>
