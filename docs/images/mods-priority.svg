    <circle cx="260" cy="130" r="6" fill="#e07b39"/><text x="260" y="120">Wider PTFE tubes</text>
    <circle cx="170" cy="175" r="6" fill="#e07b39"/><text x="170" y="165">CFS desiccant boxes</text>
    <circle cx="320" cy="205" r="6" fill="#e07b39"/><text x="320" y="195">Tuned Orca profiles</text>
    <circle cx="470" cy="100" r="6" fill="#e07b39"/><text x="470" y="90">Kinematic bed mount</text>
    <circle cx="620" cy="130" r="6" fill="#e07b39"/><text x="620" y="120">Cartographer (root)</text>
    <circle cx="500" cy="170" r="6" fill="#e07b39"/><text x="500" y="160">CFS active dryer</text>
    <circle cx="150" cy="260" r="6" fill="#e07b39"/><text x="150" y="250">Waste chute</text>
