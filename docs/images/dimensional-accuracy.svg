<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="340" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Size accuracy: two common errors</text>
<path d="M60,90 L200,90 L200,230 L206,240 L54,240 L60,230 z" fill="#e07b39"/>
<rect x="270" y="90" width="140" height="150" fill="#e07b39"/>
<text x="135" y="265" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">Elephant's foot</text>
<text x="135" y="285" text-anchor="middle" font-size="14" fill="#222">first layer bulges out</text>
<text x="340" y="265" text-anchor="middle" font-size="15" fill="#1a7a4a" font-weight="bold">Compensated</text>
<text x="340" y="285" text-anchor="middle" font-size="14" fill="#222">0.1–0.2 mm compensation</text>
<rect x="480" y="90" width="120" height="120" fill="#e07b39"/><circle cx="540" cy="150" r="30" fill="#fff"/>
<circle cx="540" cy="150" r="38" fill="none" stroke="#1a7a4a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="640" y="130" text-anchor="start" font-size="13" fill="#222">printed hole</text>
<text x="640" y="148" text-anchor="start" font-size="13" fill="#222">comes out small</text>
<text x="640" y="176" text-anchor="start" font-size="13" fill="#1a7a4a">dashed: target</text>
<text x="540" y="265" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">Undersized holes</text>
<text x="540" y="285" text-anchor="middle" font-size="14" fill="#222">use X-Y hole compensation</text>
<text x="380" y="325" text-anchor="middle" font-size="14" fill="#444">Measure with calipers before changing anything; use the tolerance test for fitting parts.</text>
</svg>
