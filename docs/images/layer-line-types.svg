<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Which "lines" do you have?</text>
  <g font-size="14" text-anchor="middle">
    <!-- 1 layer lines -->
    <rect x="30" y="50" width="160" height="170" fill="#e07b39"/>
    <g stroke="#b85a22" stroke-width="2">
      <line x1="30" y1="62" x2="190" y2="62"/><line x1="30" y1="74" x2="190" y2="74"/><line x1="30" y1="86" x2="190" y2="86"/><line x1="30" y1="98" x2="190" y2="98"/><line x1="30" y1="110" x2="190" y2="110"/><line x1="30" y1="122" x2="190" y2="122"/><line x1="30" y1="134" x2="190" y2="134"/><line x1="30" y1="146" x2="190" y2="146"/><line x1="30" y1="158" x2="190" y2="158"/><line x1="30" y1="170" x2="190" y2="170"/><line x1="30" y1="182" x2="190" y2="182"/><line x1="30" y1="194" x2="190" y2="194"/><line x1="30" y1="206" x2="190" y2="206"/>
    </g>
    <text x="110" y="245" font-weight="bold">Layer lines</text>
    <text x="110" y="263">even, every layer</text>
    <text x="110" y="281" fill="#2c7">→ thinner layers,</text><text x="110" y="299" fill="#2c7">variable layer height</text>
    <!-- 2 z banding -->
    <rect x="210" y="50" width="160" height="170" fill="#e07b39"/>
    <g stroke="#9b4515" stroke-width="5">
      <line x1="210" y1="80" x2="370" y2="80"/><line x1="210" y1="125" x2="370" y2="125"/><line x1="210" y1="170" x2="370" y2="170"/><line x1="210" y1="215" x2="370" y2="215"/>
    </g>
    <text x="290" y="245" font-weight="bold">Z banding</text>
    <text x="290" y="263">repeats every few mm</text>
    <text x="290" y="281" fill="#2c7">→ mechanics: Z rods,</text><text x="290" y="299" fill="#2c7">belts, lead screws</text>
    <!-- 3 ringing -->
    <rect x="390" y="50" width="160" height="170" fill="#e07b39"/>
    <rect x="440" y="100" width="20" height="70" fill="#ffffff"/>
    <g stroke="#b85a22" stroke-width="2" fill="none">
      <line x1="466" y1="100" x2="466" y2="170"/><line x1="474" y1="100" x2="474" y2="170"/><line x1="482" y1="100" x2="482" y2="170" opacity="0.7"/><line x1="490" y1="100" x2="490" y2="170" opacity="0.5"/><line x1="498" y1="100" x2="498" y2="170" opacity="0.3"/>
    </g>
    <text x="470" y="245" font-weight="bold">Ringing / ghosting</text>
    <text x="470" y="263">echoes after features</text>
    <text x="470" y="281" fill="#2c7">→ lower outer wall accel,</text><text x="470" y="299" fill="#2c7">rerun input shaping</text>
    <!-- 4 inconsistent extrusion -->
    <rect x="570" y="50" width="160" height="170" fill="#e07b39"/>
    <g stroke="#b85a22" fill="none" stroke-width="2">
      <path d="M570,70 q40,6 80,0 t80,0"/><path d="M570,100 q40,-6 80,0 t80,0"/><path d="M570,135 q40,8 80,0 t80,0"/><path d="M570,175 q40,-5 80,0 t80,0"/><path d="M570,200 q40,7 80,0 t80,0"/>
    </g>
    <text x="650" y="245" font-weight="bold">Uneven walls</text>
    <text x="650" y="263">random bulges/thin spots</text>
    <text x="650" y="281" fill="#2c7">→ calibrate flow and PA,</text><text x="650" y="299" fill="#2c7">dry the filament</text>
  </g>
</svg>
