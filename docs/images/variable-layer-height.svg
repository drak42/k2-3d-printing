    <text x="170" y="292" font-weight="bold">Fixed 0.20 mm</text><text x="170" y="310">big steps on the curved top</text>
    <text x="550" y="292" font-weight="bold">Variable 0.20 → 0.08 mm</text><text x="550" y="310">straight sides stay fast, curve stays smooth</text>
