  <g clip-path="url(#d1)">
    <rect x="60" y="60" width="220" height="210" fill="#e07b39"/>
    <g stroke="#fff" stroke-width="1.5">
      <line x1="60" y1="250" x2="280" y2="250"/><line x1="60" y1="230" x2="280" y2="230"/><line x1="60" y1="210" x2="280" y2="210"/><line x1="60" y1="190" x2="280" y2="190"/><line x1="60" y1="170" x2="280" y2="170"/><line x1="60" y1="150" x2="280" y2="150"/><line x1="60" y1="130" x2="280" y2="130"/><line x1="60" y1="110" x2="280" y2="110"/><line x1="60" y1="90" x2="280" y2="90"/>
    </g>
  </g>
